<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel W.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <main class="card">
    <div class="plane">✈️</div>
    <h1>Samuel W.</h1>
    <p class="location">📍 Anchorage, AK</p>
    <p class="bio">
      Flight Instructor and business manager.<br>
      I like to build stuff. 🛠️
    </p>
  </main>

  <section class="gallery">
    <h2>📸 Photos</h2>
    <div class="photos">
      <figure>
        <img src="images/up-in-the-air.jpeg" alt="View from up in the air">
        <figcaption>Up in the air</figcaption>
      </figure>
      <figure>
        <img src="images/alaska-views.jpeg" alt="Alaska landscape">
        <figcaption>Alaska views</figcaption>
      </figure>
      <figure>
        <img src="images/something-i-built.JPG" alt="Something I built">
        <figcaption>Something I built</figcaption>
      </figure>
    </div>
  </section>
</body>
</html>
